<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cuenta | LizGlam Beauty</title>
  <meta name="description" content="Gestiona tu perfil, carritos guardados y preferencias en LizGlam.">

  <!-- Icons & Fonts -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/components.css">
</head>
<body>

  <!-- Top Announcement Bar -->
  <div class="announcement-bar">
    <span>✨ Tu Espacio de Belleza Personal | LizGlam Beauty</span>
  </div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="/" class="brand-logo">
        LIZGLAM<span class="dot">.</span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a href="/">Inicio</a></li>
        <li><a href="/productos.html">Productos</a></li>
        <li><a href="/servicios.html">Servicios & Citas</a></li>
        <li><a href="/carrito.html">Carrito</a></li>
      </ul>

      <div class="nav-actions">
        <a href="/carrito.html" class="icon-btn" title="Carrito">
          <i class="bi bi-bag"></i>
          <span class="badge cart-badge">0</span>
        </a>
        <div id="navAuthContainer"></div>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <div style="background: var(--bg-alt); padding: 3rem 0; border-bottom: 1px solid var(--border-subtle); text-align: center;">
    <div class="container">
      <h1 class="font-serif" style="font-size: 2.5rem; margin-bottom: 0.5rem;">Mi Cuenta</h1>
      <p style="color: var(--text-muted);">Administra tus preferencias y consulta tus carritos guardados.</p>
    </div>
  </div>

  <!-- Main Content -->
  <main class="container" style="padding-top: 3rem; padding-bottom: 5rem;">

    <div id="accountContainer" style="max-width: 800px; margin: 0 auto;">
      <!-- Dynamic Account State -->
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom" style="border: none; padding: 2rem 0;">
      <p>&copy; 2026 LizGlam Beauty Store. @lizglamstore</p>
    </div>
  </footer>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- JS Modules -->
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/instagram.js"></script>
  <script src="/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.authManager.onAuthStateChanged(renderAccountView);
    });

    function renderAccountView(user) {
      const container = document.getElementById('accountContainer');
      if (!user) {
        container.innerHTML = `
          <div style="background: var(--bg-card); border-radius: var(--radius-lg); padding: 3rem 2rem; border: 1px solid var(--border-subtle); text-align: center;">
            <i class="bi bi-person-bounding-box" style="font-size: 3.5rem; color: var(--rose-gold); margin-bottom: 1rem; display: block;"></i>
            <h2 class="font-serif" style="font-size: 1.75rem; margin-bottom: 0.5rem;">Iniciar Sesión</h2>
            <p style="color: var(--text-muted); max-width: 450px; margin: 0 auto 1.75rem auto;">
              Inicia sesión con tu cuenta de Google para guardar tus carritos, sincronizar tus favoritos y recibir atención personalizada.
            </p>
            <button onclick="window.authManager.signInWithGoogle()" class="btn btn-primary">
              <i class="bi bi-google"></i> Iniciar Sesión con Google
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div style="background: var(--bg-card); border-radius: var(--radius-lg); padding: 2.5rem; border: 1px solid var(--border-subtle); margin-bottom: 2rem;">
          <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 1.5rem;">
            <img src="${user.photoURL}" alt="${user.displayName}" style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--rose-gold); object-fit: cover;">
            <div>
              <h2 class="font-serif" style="font-size: 1.75rem; margin-bottom: 0.25rem;">${user.displayName}</h2>
              <p style="color: var(--text-muted); font-size: 0.95rem;">${user.email}</p>
              <span style="display: inline-block; background: var(--bg-alt); color: var(--rose-gold-dark); padding: 0.25rem 0.75rem; border-radius: var(--radius-pill); font-size: 0.75rem; font-weight: 600; margin-top: 0.5rem;">
                Cliente VIP LizGlam ✨
              </span>
            </div>
            <button onclick="window.authManager.logout()" class="btn btn-sm btn-outline-rose" style="margin-left: auto;">
              <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </button>
          </div>

          <h3 class="font-serif" style="font-size: 1.35rem; margin-bottom: 1rem;">Tu Carrito Actual Guardado</h3>
          <div id="savedCartPreview" style="background: var(--bg-main); border-radius: var(--radius-md); padding: 1.25rem; margin-bottom: 1.5rem;">
            <p style="font-size: 0.9rem; color: var(--text-muted);">Cargando tu carrito sincronizado...</p>
          </div>

          <div style="display: flex; gap: 1rem;">
            <a href="/carrito.html" class="btn btn-primary">
              <i class="bi bi-bag-check"></i> Ver Carrito Completo
            </a>
            <a href="/productos.html" class="btn btn-secondary">
              <i class="bi bi-heart"></i> Explorar Más Productos
            </a>
          </div>
        </div>
      `;

      loadSavedCartPreview(user.uid);
    }

    async function loadSavedCartPreview(userId) {
      const previewEl = document.getElementById('savedCartPreview');
      if (!previewEl) return;

      try {
        const res = await fetch(`${API_URL}?action=getUserCart&userId=${userId}`);
        const data = await res.json();

        if (data.success && data.cart && data.cart.items && data.cart.items.length > 0) {
          previewEl.innerHTML = `
            <ul style="list-style: none;">
              ${data.cart.items.map(item => `
                <li style="display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px dashed var(--border-subtle);">
                  <span><strong>${item.quantity}x</strong> ${item.name}</span>
                  <span style="font-weight: 600; color: var(--rose-gold-dark);">${formatCOP(item.price * item.quantity)}</span>
                </li>
              `).join('')}
            </ul>
          `;
        } else {
          previewEl.innerHTML = `<p style="font-size: 0.9rem; color: var(--text-muted);">No tienes ítems en tu carrito guardado.</p>`;
        }
      } catch (e) {
        previewEl.innerHTML = `<p style="font-size: 0.9rem; color: var(--text-muted);">Modo Local: Carrito guardado en tu navegador.</p>`;
      }
    }
  </script>
</body>
</html>
